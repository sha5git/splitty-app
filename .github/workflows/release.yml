name: Release

# You create the GitHub Release manually (title, description, tag).
# This workflow only builds splitty-deploy.tar.gz and attaches it when you publish.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to attach bundle to (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Resolve release tag
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            echo "value=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.value }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build backend JAR
        working-directory: backend
        run: mvn -B -DskipTests package

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_API_BASE_URL: ''
        run: |
          npm ci --legacy-peer-deps
          npm run build

      - name: Package deploy bundle
        run: |
          mkdir -p bundle/frontend
          cp backend/target/expense-split-backend-0.0.1-SNAPSHOT.jar bundle/backend.jar
          cp -r frontend/dist/* bundle/frontend/
          tar -czf splitty-deploy.tar.gz -C bundle .

      - name: Upload bundle to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.value }}"

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "ERROR: Release $TAG does not exist." >&2
            echo "Create the release on GitHub first (title + description + tag), then publish it." >&2
            exit 1
          fi

          gh release upload "$TAG" splitty-deploy.tar.gz --clobber
          echo "Uploaded splitty-deploy.tar.gz to release $TAG"
