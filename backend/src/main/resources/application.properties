spring.application.name=expense-split-backend

# Database configuration (set DB_URL, DB_USERNAME, DB_PASSWORD in your environment)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/expensesplit}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Firebase configuration
# Config path can be an external file or classpath.
# We will set a default classpath path, but if mock mode is true, we won't crash on missing config.
firebase.config.path=classpath:firebase-service-account.json
firebase.mock=false
